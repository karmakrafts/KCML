<html>
<body>
Reports <code>dev.karmakrafts.kcml.api.target.OnlyOn</code> annotations on non-function types.
Only function types (closures), including nullable function types and aliases to function types, may carry this type
annotation.
Declaration annotations are unaffected. Errors can be suppressed with <code>KCML_ONLY_ON_TYPE</code>.
</body>
