[versions]

java = "21"

kotlinBootstrap = "2.5.0-dev-9169" # https://github.com/JetBrains/kotlin/blob/v2.5.0-RC2/gradle.properties#L50
kotlin = "2.5.0-RC2" # https://github.com/JetBrains/kotlin/releases
androidGradle = "9.5.3" # https://developer.android.com/reference/tools/gradle-api

kcml = "1.6.0"
iridium = "1.15.0.116-SNAPSHOT" # https://github.com/karmakrafts/Iridium/tags
kotlinx-serialization = "1.13.0" # https://github.com/Kotlin/kotlinx.serialization/releases
dokka = "2.3.0" # https://github.com/Kotlin/dokka/releases"
karmaConventions = "1.23.0.329-SNAPSHOT" # https://github.com/karmakrafts/karma-conventions/tags
autoService = "1.1.1" # https://github.com/google/auto/releases
semver = "3.1.0" # https://github.com/z4kn4fein/kotlin-semver/releases
ow2asm = "9.11.1" # https://gitlab.ow2.org/asm/asm/-/tags
shadow = "9.6.1" # https://github.com/GradleUp/shadow
kotlinGraphs = "0.6.1" # https://github.com/alexandrepiveteau/kotlin-graphs/releases
annotations = "26.1.0" # https://github.com/JetBrains/java-annotations/releases

intelliJPlatform = "2.20.1" # https://github.com/JetBrains/intellij-platform-gradle-plugin/releases
intelliJVersion = "2026.3.0.1"
intelliJKotlinToolchain = "263.7307.231" # https://plugins.jetbrains.com/plugin/31850-kotlin-toolchain/versions
intelliJKotlinMultiplatform = "263.7307.353-IJ" # https://plugins.jetbrains.com/plugin/14936-kotlin-multiplatform/versions
intelliJAndroid = "263.7307.353" # https://plugins.jetbrains.com/plugin/22989-android/versions
intelliJAndroidDesignTools = "263.7307.112" # https://plugins.jetbrains.com/plugin/22990-android-design-tools/versions
intelliJJetpackCompose = "263.7307.112" # https://plugins.jetbrains.com/plugin/18409-jetpack-compose/versions
intelliJNativeDebugging = "263.7307.200" # https://plugins.jetbrains.com/plugin/12775-native-debugging-support/versions

[libraries]

kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlinBootstrap" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
kotlin-native-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-native-compiler-embeddable", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

autoService-processor = { module = "com.google.auto.service:auto-service", version.ref = "autoService" }
autoService-annotations = { module = "com.google.auto.service:auto-service-annotations", version.ref = "autoService" }

iridium = { module = "dev.karmakrafts.iridium:iridium", version.ref = "iridium" }
semver = { module = "io.github.z4kn4fein:semver", version.ref = "semver" }
kotlinGraphs = { module = "io.github.alexandrepiveteau:kotlin-graphs", version.ref = "kotlinGraphs" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }

ow2-asm-core = { module = "org.ow2.asm:asm", version.ref = "ow2asm" }
ow2-asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "ow2asm" }
ow2-asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "ow2asm" }

[plugins]

android-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradle" }

kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinBootstrap" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlinBootstrap" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinBootstrap" }

dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
karmaConventions = { id = "dev.karmakrafts.conventions.karma-conventions", version.ref = "karmaConventions" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }